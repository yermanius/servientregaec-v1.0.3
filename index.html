<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador Oficinas v1.0.3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}.container{max-width:1200px;margin:0 auto;background:#fff;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:30px;text-align:center}.header h1{font-size:2rem;margin-bottom:10px}.header p{opacity:.9;font-size:.95rem}.content{padding:30px}.search-section{background:#f8f9fa;padding:25px;border-radius:10px;margin-bottom:25px}.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin-bottom:15px}.form-group{display:flex;flex-direction:column}.form-group label{font-weight:600;margin-bottom:5px;color:#333;font-size:.9rem}.form-group input,.form-group select{padding:10px 12px;border:2px solid #e0e0e0;border-radius:6px;font-size:.95rem;transition:all .3s}.form-group input:focus,.form-group select:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}.button-group{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}.btn{padding:10px 20px;border:none;border-radius:6px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .3s;flex:1;min-width:150px}.btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,.4)}.btn-secondary{background:#6c757d;color:#fff}.btn-secondary:hover{background:#5a6268}.btn-test{background:#28a745;color:#fff}.btn-test:hover{background:#218838}.btn:disabled{cursor:not-allowed;opacity:.55;transform:none}.results-section{margin-top:25px}.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #e0e0e0}.results-count{font-size:1.1rem;font-weight:600;color:#667eea}.results-grid{display:grid;gap:15px}.office-card{background:#fff;border:2px solid #e0e0e0;border-radius:8px;padding:20px;transition:all .3s}.office-card:hover{border-color:#667eea;box-shadow:0 5px 15px rgba(0,0,0,.1);transform:translateY(-2px)}.office-name{font-size:1.15rem;font-weight:700;color:#333;margin-bottom:8px}.office-address{color:#555;margin-bottom:10px;line-height:1.5}.office-meta{color:#888;font-size:.85rem;font-style:italic;margin-bottom:4px}.office-carrier{color:#667eea;font-size:.85rem;font-weight:700;margin-bottom:10px}.copy-btn{background:#17a2b8;color:#fff;border:none;padding:6px 12px;border-radius:4px;font-size:.85rem;cursor:pointer;transition:all .3s}.copy-btn:hover{background:#138496}.empty-state{text-align:center;padding:60px 20px;color:#888}.empty-state-icon{font-size:4rem;margin-bottom:15px}.empty-state-text{font-size:1.1rem}.debug-panel{background:#f8f9fa;border:1px solid #dee2e6;border-radius:6px;padding:15px;margin-top:25px;font-size:.85rem}.debug-panel h3{margin-bottom:10px;color:#495057}.debug-panel .status-ok{color:#28a745;font-weight:600}.debug-panel .status-error{color:#dc3545;font-weight:600}@media (max-width:768px){.header h1{font-size:1.5rem}.form-row{grid-template-columns:1fr}.btn{min-width:100%}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>🏢 Buscador de Oficinas v. 1.0.3</h1><p>Servientrega Ecuador - Encuentra tu oficina más cercana</p></div>
<div class="content">
<div class="search-section">
<div class="form-row">
<div class="form-group"><label for="provinciaSelect">Provincia (Opcional)</label><select id="provinciaSelect" disabled><option value="">Todas las provincias</option></select></div>
<div class="form-group"><label for="buscarCiudadInput">Buscar Ciudad</label><input type="text" id="buscarCiudadInput" placeholder="Escribe para filtrar..." disabled></div>
</div>
<div class="form-row">
<div class="form-group"><label for="ciudadSelect">Ciudad *</label><select id="ciudadSelect" size="8" disabled><option value="">Cargando oficinas...</option></select></div>
<div class="form-group"><label for="filtroOficinaInput">Filtrar Oficinas</label><input type="text" id="filtroOficinaInput" placeholder="Filtrar por nombre o dirección..." disabled></div>
</div>
<div class="button-group">
<button class="btn btn-secondary" id="limpiarBtn" disabled>Limpiar</button>
<button class="btn btn-primary" id="copiarTodasBtn" disabled>Copiar Todas las Direcciones</button>
<button class="btn btn-test" id="autoTestBtn" disabled>Auto-Test</button>
</div>
</div>
<div class="results-section"><div class="results-header"><div class="results-count" id="resultsCount">Cargando oficinas...</div></div>
<div class="results-grid" id="resultsGrid"><div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-text">Sincronizando la base de datos</div></div></div></div>
<div class="debug-panel" id="debugPanel"><h3>Estado del Sistema</h3><div id="debugContent">Cargando datos...</div></div>
</div>
</div>
<script src="app.js" defer></script>
</body>
</html>
